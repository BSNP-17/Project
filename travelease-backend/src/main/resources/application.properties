# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/travelease}

# JWT Settings
# IMPORTANT: Set APPLICATION_JWT_SECRET as an environment variable in production.
# Minimum 32 characters. Never commit the real value here.
application.security.jwt.secret-key=${APPLICATION_JWT_SECRET:CHANGE_ME_USE_ENV_VAR_MIN_32_CHARS!!}
application.security.jwt.expiration=${APPLICATION_JWT_EXPIRATION:86400000}

server.port=8080

# =====================================================
#   Admin Seed Credentials
#   REQUIRED: Set these as environment variables.
#   DO NOT hardcode real values here.
# =====================================================
travelease.admin.fullname=TravelEase Administrator
travelease.admin.email=${ADMIN_EMAIL:te.superadmin@travelease.in}
travelease.admin.phone=${ADMIN_PHONE:+91-00000-00000}
travelease.admin.password=${ADMIN_PASSWORD:CHANGE_ME_IN_ENV}

# =====================================================
#   Email / SMTP (Gmail) — used for OTP sending
#   REQUIRED: Set MAIL_USERNAME and MAIL_PASSWORD
#   as environment variables. Never commit credentials.
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
